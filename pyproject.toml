[project]
name = "homeassistant-danfoss-ecl-modbus"
version = "0.1.0"
description = "Home Assistant custom integration for Danfoss ECL Modbus controllers"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "modbus-connection[tmodbus]>=4.12.7",
]

[dependency-groups]
dev = [
    "homeassistant==2026.11.2",
    "pytest-homeassistant==2026.11.2",
    "pymodbus==3.13.1",
    "pytest-cov>=7.0.0",
    "mypy>=1.18.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.danfoss_ecl_modbus", "tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = [".venv", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx --cov=custom_components.danfoss_ecl_modbus --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.danfoss_ecl_modbus"]

[tool.coverage.report]
show_missing = true
fail_under = 90
